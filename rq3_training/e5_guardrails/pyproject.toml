[project]
name = "e5_guardrails"
version = "0.1.0"
description = "RQ3: CE vs SupCon vs CE + SupCon fine-tuning of one E5 encoder, shared linear-probe evaluation"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "transformers>=4.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
e5-guardrails = "e5_guardrails.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
