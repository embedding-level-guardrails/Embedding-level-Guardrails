[project]
name = "ettin_guardrails"
version = "0.1.0"
authors = [
    { name = "Daria Kaigorodtseva", email = "daria.kay000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.4,<4",
    "datasets>=3,<5",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "huggingface-hub~=1.31",
    "hydra-core~=1.3",
    "jupyter>=1.1.1",
    "omegaconf>=2.3.1",
    "polars~=1.44",
    "torch~=2.14",
    "transformers~=5.17",
]

[project.scripts]
ettin-guardrails = "ettin_guardrails.train:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
